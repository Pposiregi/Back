server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    backoff_config:
      min_period: 500ms
      max_period: 5s
      max_retries: 10

scrape_configs:
  - job_name: fitpet-app-json-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: fitpet-app
          parser: json
          __path__: /var/log/fitpet/*-json*.log
    pipeline_stages:
      - json:
          expressions:
            ts: '"@timestamp"'
            level: level
            logger: logger_name
            thread: thread_name
            message: message
            stacktrace: stack_trace
            trace_id: traceId
            span_id: spanId
      - timestamp:
          source: ts
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
      - labels:
          level:
          logger:
          trace_id:
          span_id:
      - output:
          source: message
