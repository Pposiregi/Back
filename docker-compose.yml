name: fitpet

services:

  # ── Spring Boot App ─────────────────────────────────────────────────────────
  app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitpet-app
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ACTIVE_PROFILE: ${ACTIVE_PROFILE:-local}
      SPRING_PROFILES_ACTIVE: ${ACTIVE_PROFILE:-local}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      LOG_PATH: /app/logs
    volumes:
      - fitpet-logs:/app/logs
    ports:
      - "8080:8080"
    networks:
      - fitpet
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── RabbitMQ ────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fitpet-rabbitmq
    hostname: fitpet-rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    networks:
      - fitpet
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Valkey (Redis OSS-compatible cache/store) ──────────────────────────────
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: fitpet-valkey
    hostname: fitpet-valkey
    restart: unless-stopped
    env_file:
      - .env
    command:
      - sh
      - -c
      - >
        exec valkey-server
        --requirepass "$$VALKEY_PASSWORD"
        --appendonly yes
        --save "900 1 300 10 60 10000"
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    networks:
      - fitpet
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: fitpet-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}
      - --web.enable-lifecycle
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - fitpet

  # ── Loki ────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.8
    container_name: fitpet-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - fitpet

  # ── Alloy (log collector) ───────────────────────────────────────────────────
  alloy:
    image: grafana/alloy:v1.12.1
    container_name: fitpet-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --config.format=promtail
      - /etc/alloy/config.promtail.yml
    depends_on:
      - loki
    volumes:
      - ./observability/alloy/config.promtail.yml:/etc/alloy/config.promtail.yml:ro
      - fitpet-logs:/var/log/fitpet:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345"
    networks:
      - fitpet

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: fitpet-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - fitpet

networks:
  fitpet:
    driver: bridge

volumes:
  rabbitmq-data:
  valkey-data:
  prometheus-data:
  loki-data:
  grafana-data:
  alloy-data:
  fitpet-logs:
