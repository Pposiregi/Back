name: FitPet CI/CD Pipeline

on:
  push:
    branches: [ "refactor/cicd-gcp" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            # [핵심 1] 명령어 실패 시 스크립트 즉시 중단 (거짓 성공 방지)
            set -e 

            # 경로 이동
            cd ~/Back
            
            echo ">>> 1. 최신 코드 가져오기"
            # [핵심 2] 원격 저장소의 최신 상태를 가져오고, 테스트 브랜치로 확실하게 변경
            git fetch origin
            git checkout refactor/cicd-gcp
            git pull origin refactor/cicd-gcp
            
            echo ">>> 2. 앱 컨테이너만 재빌드 및 실행"
            docker compose up -d --build app
            
            echo ">>> 3. 사용하지 않는 이전 이미지 정리 (용량 확보)"
            docker image prune -f
            
            echo ">>> 배포 완료!"