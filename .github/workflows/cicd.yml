name: FitPet CI/CD Pipeline

on:
  push:
    branches: [ "refactor/cicd-gcp" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            # 에러 발생 시 즉시 중단
            set -e 

            # 1. ~ 대신 정확한 절대 경로 변수 설정
            PROJECT_PATH="/home/cky4594709/Back"
            
            # 2. 다른 계정(ubuntu 등)으로 접속해도 Git 권한 에러가 나지 않도록 안전 폴더 등록
            sudo git config --global --add safe.directory $PROJECT_PATH
            
            # 절대 경로로 이동
            cd $PROJECT_PATH
            
            echo ">>> 1. 최신 코드 가져오기"
            sudo git fetch origin
            sudo git checkout refactor/cicd-gcp
            sudo git pull origin refactor/cicd-gcp
            
            echo ">>> 2. 앱 컨테이너만 재빌드 및 실행"
            sudo docker compose up -d --build app
            
            echo ">>> 3. 사용하지 않는 이전 이미지 정리"
            sudo docker image prune -f
            
            echo ">>> 배포 완료!"