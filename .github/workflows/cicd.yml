name: FitPet CI/CD Pipeline

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e 
            PROJECT_PATH="/home/cky4594709/Back"
            sudo git config --global --add safe.directory $PROJECT_PATH
            cd $PROJECT_PATH
            
            echo ">>> 1. 최신 코드 가져오기"
            sudo git fetch origin
            sudo git checkout dev
            sudo git pull origin dev
            
            echo ">>> 2. 앱 컨테이너만 빌드 (서버 자원 100% 사용 구간)"
            sudo docker compose build app
            
            echo ">>> 3. 서버 숨 고르기 (헬스체크 회복 대기)"
            sleep 30
            
            echo ">>> 4. 전체 컨테이너 상태 점검 및 앱 실행"
            sudo docker compose up -d
            
            echo ">>> 5. 사용하지 않는 이전 이미지 정리"
            sudo docker image prune -f
            
            echo ">>> 배포 완료!"