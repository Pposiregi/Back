name: FitPet CI/CD Pipeline

# main 브랜치에 push가 발생할 때 자동으로 실행됩니다.
on:
  push:
    branches: [ "refactor/cicd-gcp" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. GitHub 서버에서 소스 코드를 체크아웃 (기본 단계)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. GCP VM에 SSH로 접속하여 배포 명령 실행
      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            # GCP VM 내부의 프로젝트 폴더로 이동 (경로가 다르면 수정하세요)
            cd ~/fitpet
            
            echo ">>> 1. 최신 코드 가져오기 (git pull)"
            git pull origin main
            
            echo ">>> 2. 앱 컨테이너만 재빌드 및 실행"
            # --build: 코드가 변경되었으니 다시 빌드
            # -d: 백그라운드 실행
            # app: docker-compose.yml에 정의된 app 서비스만 타겟팅
            docker compose up -d --build app
            
            echo ">>> 3. 사용하지 않는 이전 이미지 정리 (용량 확보)"
            docker image prune -f
            
            echo ">>> 배포 완료!"