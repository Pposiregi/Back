spring:
  profiles:
    active: ${ACTIVE_PROFILE}
  main:
    web-application-type: servlet
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+09:00'
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul

  data:
    redis:
      host: ${VALKEY_HOST}
      port: ${VALKEY_PORT}
      password: "${VALKEY_PASSWORD}"
  security:
    user:
      name: ${SECURITY_USER}
      password: ${SECURITY_PASSWORD}
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  access:
    secret: ${JWT_ACCESS_SECRET}
    expiration-ms: ${JWT_ACCESS_EXPIRATION_MS}
  refresh:
    secret: ${JWT_REFRESH_SECRET}
    expiration-ms: ${JWT_REFRESH_EXPIRATION_MS}

oauth:
  google:
    client-id: ${spring.security.oauth2.client.registration.google.client-id}
  kakao:
    user-info-uri: ${spring.security.oauth2.client.provider.kakao.user-info-uri}

logging:
  level:
    org.springframework.security: DEBUG

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    region:
      static: ap-northeast-2
    stack:
      auto: false

aws:
  s3:
    bucket: fitpet-bucket

fcm:
  service-account-key-path: ${FCM_PATH}
  project-id: fitp-9e7ad

# 2025.12.26 MANDARIN] 현재 페이지 기준 origin API 호출 설정
springdoc:
  swagger-ui:
    disable-swagger-default-url: true
